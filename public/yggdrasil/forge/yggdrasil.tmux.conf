set -g mouse on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 10
set -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind | split-window -h
bind - split-window -v
bind r source-file ~/.tmux.conf \; display "Config reloaded!"
bind s new-session -c "$HOME/Projects"
bind S choose-tree

# ─── Yggdrasil palette (Volta Violet + Lario Blue) ───
volta0='#0a0a0a'
volta1='#0d1117'
volta2='#1a1a2e'
volta3='#64748b'
volta4='#8b5cf6'
volta5='#a78bfa'
volta6='#c4b5fd'
lario0='#3b82f6'
lario1='#60a5fa'
lario2='#93c5fd'
slate='#f3f4f6'
stone='#64748b'
berry='#ef4444'
emerald='#4ade80'

# ─── Status bar: transparent with Volta Violet accent ───
set -g status-style "bg=terminal,fg=terminal"
set -g status-left "#[fg=#8b5cf6]▎  #[fg=#8b5cf6,bold]ᛉ    "
set -g status-left-length 25
set -g status-right "#[fg=#8b5cf6]#(cd '#{pane_current_path}' && git rev-parse --abbrev-ref HEAD 2>/dev/null)#[fg=#64748b]   %H:%M   #[fg=#8b5cf6]ᚠ  #[fg=#8b5cf6]▎"
set -g status-right-length 60
set -g status-interval 30
set -g status-justify left
set -g status-position bottom

# Windows — Volta Violet selected, Slate Muted default
setw -g window-status-current-style "bg=#8b5cf6,fg=#0a0a0a,bold"
setw -g window-status-style "fg=#64748b"
setw -g window-status-format "  #I  "
setw -g window-status-current-format "  #I  "
setw -g window-status-separator ""

# Pane borders — Lario Blue active
set -g pane-border-style "fg=#1a1a2e,bg=terminal"
set -g pane-active-border-style "fg=#60a5fa,bg=terminal"

# Messages
set -g message-style "bg=#1a1a2e,fg=#c4b5fd"

